# Pinned tools (PRACTICES, Dependencies are deliberate: each tool earns its place) and
# settings. Tasks are files under mise-tasks/: `check` runs the whole validation
# ladder, `check:fast` the inner loop (the steps are scripts/steps/), `gen` every generator.

[tools]
node = "26.10.0"
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
# The wasm tool, as prebuilt release binaries: `mise run build:wasm` binds crates/wasm with
# it. Its version must equal the `wasm-bindgen` crate version pinned in Cargo.toml.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
# The simulation track's runner (PRACTICES, Simulation with patina: Tooling), built from
# source once at the same revision as the SDK git dependencies in Cargo.toml. Only
# `mise run sim` uses it; the check ladder never does.
"cargo:https://github.com/JacobHayes/patina" = { version = "rev:6a2977e7bce794d15eabaa18258a5542115bd872", crate = "cargo-patina", locked = true }

[env]
# A fixed build time for every build, local and CI. turso_core's build script embeds the wall
# clock in its output unless this is set, so the crate and everything built on it missed the
# build cache in every fresh target directory. The value is the time of the project's first commit (2026-10-06T07:13:23Z).
SOURCE_DATE_EPOCH = "1791270803"
