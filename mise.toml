# Pinned tools (PRACTICES, Dependencies are deliberate: each tool earns its place) and
# settings. Tasks are files under mise-tasks/: `check` runs the whole validation
# ladder, `check:fast` the inner loop (the steps are scripts/steps/), `gen` every generator.

[tools]
node = "26.12.1"
rust = { version = "1.99.1", profile = "minimal", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
# The wasm tool, as prebuilt release binaries: `mise run build:wasm` binds crates/wasm with
# it. Its version must equal the `wasm-bindgen` crate version pinned in Cargo.toml.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
# The wasm optimizer: `mise run build:wasm` runs it over the optimized (wasm profile) module
# to shrink it (decisions/2026-10-21-a-tabs-memory-is-cut-only-where-it-costs-no-time.md).
"github:WebAssembly/binaryen" = "version_133"
# The simulation track's runner (PRACTICES, Simulation with patina: Tooling), built from
# source once at the same revision as the SDK git dependencies in Cargo.toml. Only
# `mise run sim` uses it; the check ladder never does.
"cargo:https://github.com/JacobHayes/patina" = { version = "rev:1dee57b448d57c390af26a9d5af5f2d3a8820cc8", crate = "cargo-patina", locked = true }
# RustSec advisories over every lock file: the full check's advisories step (deny.toml).
cargo-deny = "0.20.2"
# Dependencies a crate declares and never uses: the lint step's unused-dependency check
# (decisions/2026-10-24-where-mutation-testing-runs.md).
"github:bnjbvr/cargo-machete" = "0.9.2"
