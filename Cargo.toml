[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/JacobHayes/cairn"
publish = false

[workspace.dependencies]
cairn-auth = { path = "crates/auth" }
cairn-engine = { path = "crates/engine" }
cairn-schema = { path = "crates/schema" }
cairn-store = { path = "crates/store" }
cairn-store-turso = { path = "crates/store-turso" }
# The auth crate (ARCHITECTURE, Auth): axum for the layer and the providers' own routes
# (HTTP/1 on tokio, as the spike proved, plus forms, queries, and JSON for the OAuth
# endpoints); base64 for the built-in server's client ids; chrono only for the clock
# openidconnect checks expiry against; cookie for the session and sign-in cookies;
# ed25519-dalek only to sign a test issuer's ID tokens; getrandom for secrets; subtle to
# compare them in constant time; url for the public base URL; hyper, hyper-util, and
# http-body-util for the one GET to tailscaled's whois over its unix socket (already in the
# tree under axum and reqwest); tower only to drive a router in tests.
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false }
cookie = "0.18.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "std"] }
getrandom = "0.3.4"
http-body-util = "0.1.3"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# The OIDC client (ARCHITECTURE, Auth; PRACTICES names it): discovery, the code exchange
# with PKCE, and ID token verification. Its default features bring reqwest 0.12 on tokio
# with rustls (ring, webpki roots): the HTTP client and TLS stack for issuer calls.
openidconnect = "4.0.1"
subtle = "2.6.1"
tower = { version = "0.5.2", default-features = false, features = ["util"] }
url = "2.5.8"
jsonschema = { version = "0.58.5", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["serde", "std"] }
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
schemars = { version = "1.2.2", features = ["jiff02"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
# The store backends (ARCHITECTURE, Backends): Turso pinned exactly while pre-1.0, without its
# default allocator and full-text search; tokio for the Turso backend's pool alone.
tokio = { version = "1.53.2", default-features = false }
turso = { version = "=0.8.2", default-features = false }
# The patina SDK (PRACTICES, Simulation with patina), all at one revision: the same one
# `cargo-patina` is pinned to when the simulation track adds it to mise.toml. A crate opts
# in with `patina-dst.workspace = true`; until one does, cargo resolves none of them.
patina-dst = { git = "https://github.com/JacobHayes/patina", rev = "6a2977e7bce794d15eabaa18258a5542115bd872" }
patina-dst-harness = { git = "https://github.com/JacobHayes/patina", rev = "6a2977e7bce794d15eabaa18258a5542115bd872" }
patina-dst-proptest = { git = "https://github.com/JacobHayes/patina", rev = "6a2977e7bce794d15eabaa18258a5542115bd872" }

# Every crate inherits these with `[lints] workspace = true`; rung 1 fails a crate that
# does not. The lints PRACTICES denies only in some crates (indexing and HashMap in the
# engine, panics in handlers) are raised per crate by rung 1 (mise-tasks/check/1), and
# clippy.toml holds the thresholds. Rung 1 also denies warnings, so pedantic fails it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
# Configured in clippy.toml, raised to deny only for the engine by rung 1.
disallowed_types = "allow"
