[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Frozen: a release takes its version from its git tag at build time (CAIRN_VERSION, read by
# crates/cairn/build.rs), and the guard in crates/wasm/src/lib.rs fails a build that changes this.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/JacobHayes/cairn"
publish = false

[workspace.dependencies]
cairn-api = { path = "crates/api" }
cairn-assistant = { path = "crates/assistant" }
cairn-auth = { path = "crates/auth" }
cairn-engine = { path = "crates/engine" }
cairn-mcp = { path = "crates/mcp" }
cairn-schema = { path = "crates/schema" }
cairn-service = { path = "crates/service" }
cairn-store = { path = "crates/store" }
cairn-store-sqlite = { path = "crates/store-sqlite" }
cairn-wasm = { path = "crates/wasm" }
# The auth crate (ARCHITECTURE, Auth): axum for the layer and the providers' own routes
# (HTTP/1 on tokio, plus forms, queries, and JSON for the OAuth
# endpoints); base64 for the built-in server's client ids; chrono only for the clock
# openidconnect checks expiry against (and the claims of the demo's stub issuer); cookie for
# the session and sign-in cookies; ed25519-dalek only to sign the ID tokens of `cairn demo`'s
# stub issuer and of the tests; p256 only to sign test IAP
# assertions (already in the tree under openidconnect); getrandom for secrets; subtle to
# compare them in constant time; url for the public base URL; hyper, hyper-util, and
# http-body-util for the one GET to tailscaled's whois over its unix socket (already in the
# tree under axum and reqwest); ipnet for the networks Tailscale's proxy mode trusts (already
# in the tree under reqwest); tower only to drive a router in tests.
# The store traits (ARCHITECTURE, Store trait): plain `async fn` in a trait that stays object-safe
# and `Send`; already compiled in the tree through rmcp.
async-trait = "0.1.92"
base64 = "0.23.1"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false }
cookie = "0.18.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "std"] }
getrandom = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
ipnet = { version = "2.12.2", default-features = false, features = ["std"] }
# The OIDC client (ARCHITECTURE, Auth; PRACTICES names it): discovery, the code exchange
# with PKCE, and ID token verification. Its default features bring reqwest 0.12 on tokio
# with rustls (ring, webpki roots): the HTTP client and TLS stack for issuer calls.
openidconnect = "4.0.1"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
subtle = "2.6.1"
tower = { version = "0.5.2", default-features = false, features = ["util"] }
url = "2.5.8"
# The HTTP API (ARCHITECTURE, HTTP API; Observability): futures-core for the SSE body's
# stream trait (already in the tree under axum); tracing for structured request logs (in
# the tree under hyper-util and rmcp); metrics, the facade 4.7 attaches an exporter to, for request,
# patch, and panic counts and latencies; metrics-util only to read them back in tests.
futures-core = "0.3.34"
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The binary (ARCHITECTURE, Build, run, deploy; Observability): clap for its commands; toml
# for the configuration file; rust-embed to embed the web build, with each file's media
# type; socket2 to set TCP_USER_TIMEOUT and keepalive on accepted connections (in the tree
# under tokio); tracing-subscriber for JSON logs; the Prometheus exporter for `/metrics`,
# without its own HTTP listener or push gateway.
clap = { version = "4.6.7", features = ["derive"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
# Media types for `cairn`'s `web-dir` feature, the guess rust-embed makes when it embeds.
mime_guess = { version = "2.0.5", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
jsonschema = { version = "0.59.0", default-features = false }
# The MCP endpoint (ARCHITECTURE, MCP endpoint names it): rmcp's server over Streamable HTTP
# as a tower service the API mounts; its client only drives the endpoint in tests.
rmcp = { version = "3.5.1", default-features = false }
# The assistant's providers (ARCHITECTURE, Assistant): one JSON POST per model call over
# HTTPS. reqwest is already in the tree under openidconnect with these features (rustls,
# webpki roots), so the assistant adds no new crate.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
jiff = { version = "0.2.37", default-features = false, features = ["serde", "std"] }
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
schemars = { version = "1.2.2", features = ["jiff02"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
# Compresses the stamped page at startup (the rest of the web build is compressed when built).
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = "1"
# The store backends (ARCHITECTURE, Backends): rusqlite with SQLite bundled (compiled from
# its amalgamation, so every build has the same SQLite whatever the host has) and its
# prepared-statement cache; tokio for the SQLite backend's waits for a connection alone.
# rustix, on Linux only, for the safe `posix_fadvise` the SQLite backend evicts cached
# database pages with at open (already in the tree under other crates).
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
tokio ={ version = "1.54.1", default-features = false }
# The browser host (ARCHITECTURE, Web UI): the Rust half of the wasm bindings. Pinned exactly,
# because the `wasm-bindgen` CLI in mise.toml must be this same version to generate them.
wasm-bindgen = "=0.2.129"
# The patina SDK (PRACTICES, Simulation with patina), at one revision: the one `cargo-patina` is
# pinned to in mise.toml, and the one the testbed manifests name (they are separate workspaces).
patina-dst = { git = "https://github.com/JacobHayes/patina", rev = "1dee57b448d57c390af26a9d5af5f2d3a8820cc8" }
patina-dst-proptest = { git = "https://github.com/JacobHayes/patina", rev = "1dee57b448d57c390af26a9d5af5f2d3a8820cc8" }

# Every crate inherits these with `[lints] workspace = true`; the lint step fails a crate that
# does not. The lints PRACTICES denies only in some crates (indexing and HashMap in the
# engine, panics in handlers) are raised per crate by the lint step (scripts/steps/lint), and
# clippy.toml holds the thresholds. That step also denies warnings, so pedantic fails it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
# Configured in clippy.toml, raised to deny only for the engine by the lint step.
disallowed_types = "allow"

# Debug builds, and the test profile that inherits them: one setting for every crate, so
# `serve`, the tests and the checks share one set of artifacts. Level 1 is what makes the
# build cheap: from level 1 down rustc shares generic instantiations between crates, where at
# level 2 every final binary compiles its own copy of serde's and tokio's; the engine's
# property and cost tests still run in seconds, where level 0 takes minutes. No LTO: Cargo's
# default (thin, within a crate) cost about a third of a full build's CPU. The test crate
# alone is level 0: its code is the tests (serde and harness glue), so it compiles in 15 s
# instead of 65 and runs no slower. Measured in
# decisions/2026-10-17-the-dev-profile-builds-at-opt-level-1-without-lto.md.
# Debug assertions and overflow checks stay on. Line tables for the workspace's own crates,
# so panics and backtraces still name file and line, and no debug info for dependencies: with
# full debug info every test binary was hundreds of megabytes, each with its own copy of
# its dependencies'. Lower both locally to step through code in a debugger.
[profile.dev]
opt-level = 1
lto = "off"
debug = "line-tables-only"

[profile.dev.package.cairn-tests]
opt-level = 0

[profile.dev.package."*"]
debug = false

# The browser host's build (brief 4.5): the release profile built for size, its symbols
# stripped and linked as one unit, so the module the page downloads is small and the tab
# holds less memory (the build task also runs wasm-opt over it). Level "s" rather than 3
# costs nothing a person feels and saves about 12 MB of a tab
# (decisions/2026-10-21-a-tabs-memory-is-cut-only-where-it-costs-no-time.md). The wasm build
# task uses it for the release build and in CI (CAIRN_WASM_PROFILE=wasm); the link takes
# most of a minute.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true
lto = true
codegen-units = 1

# The browser host's build in the development loop (`mise run check`, `gen`, `serve`): no LTO
# and opt-level 1, so a change to the engine rebuilds the module in seconds, and stripped like
# the wasm profile. Stripping is what decides the bindings: it drops the module's target
# features section, without which wasm-bindgen binds through the stack instead of multiple
# return values, so both profiles generate the same web/wasm/generated/
# (decisions/2026-10-08-the-check-builds-the-wasm-module-without-lto.md).
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false
strip = true
