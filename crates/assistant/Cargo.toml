[package]
name = "cairn-assistant"
description = "The optional in-app assistant: a vendor-neutral provider trait with the Anthropic Messages, OpenAI Responses, and OpenAI-compatible chat-completions protocols, a server-side tool loop over the MCP tool set in process, and the write wrapper that turns structural and bulk writes into proposals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
