metrics.workspace = true
patina-dst.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
cairn-engine.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }

