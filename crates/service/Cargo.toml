[package]
name = "cairn-service"
description = "The service layer: the one caller of the engine (load, apply, commit, notify), the capabilities document, and the composition root types every host fills in. Runtime-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cairn-engine.workspace = true
