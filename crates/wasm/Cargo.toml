[package]
name = "cairn-wasm"
description = "The browser's engine: the derive, apply, projections, preview, touched sets, and route file text over JSON, for the functions the app calls locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so the native tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
cairn-engine.workspace = true
cairn-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cairn-engine = { workspace = true, features = ["testing"] }

[lints]
workspace = true
