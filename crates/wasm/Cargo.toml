[package]
name = "cairn-wasm"
description = "The browser host: the engine's derive, apply, projections, preview, touched sets, and route files over JSON for every host, and the in-browser root that runs the service over the memory store seeded from the fixtures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so the native tests and the cases generator link it.
crate-type = ["cdylib", "rlib"]

[features]
# The server's side of the agreement (`cairn_wasm::cases`): the fixtures walked through the
# service natively, and a document at the limits, for the native agreement tests, the browser
# tests, and the benchmark. Native only; never part of the browser build.
server = ["cairn-engine/testing"]

[[bin]]
name = "cairn-wasm-cases"
path = "src/bin/cases.rs"
required-features = ["server"]

[dependencies]
cairn-engine.workspace = true
cairn-schema.workspace = true
cairn-service.workspace = true
cairn-store.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cairn-api.workspace = true
cairn-engine = { workspace = true, features = ["testing"] }
# The fixture server (examples/fixture_server.rs) the web shell's server host is tested
# against: the API over the fixtures, signed in by the dev provider.
axum.workspace = true
cairn-auth.workspace = true
tokio = { workspace = true, features = ["net", "rt"] }
# 3.2's stub OIDC issuer, which the fixture server starts beside itself so a browser test
# links an identity (brief 5.5): what that test code builds its tokens and keys with.
chrono.workspace = true
ed25519-dalek.workspace = true
openidconnect.workspace = true
url.workspace = true

[lints]
workspace = true
