[package]
name = "cairn-api"
description = "The HTTP API: axum endpoints over the service behind the auth layer, error bodies, limits, observability, the SSE revision stream, the generated OpenAPI document, and the Rust client with its safe retry and subscription tracking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["matched-path"] }
cairn-auth.workspace = true
cairn-schema.workspace = true
cairn-service.workspace = true
cairn-store.workspace = true
futures-core.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
metrics.workspace = true
patina-dst.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
cairn-engine.workspace = true
jiff.workspace = true
jsonschema.workspace = true
metrics-util.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }

[lints]
workspace = true
