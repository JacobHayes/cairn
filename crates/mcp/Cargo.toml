[package]
name = "cairn-mcp"
description = "The MCP endpoint's tool set: a curated set of agent tools over the service, each with a schema from the shared types and bounded output, callable in process (the assistant) and served over MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
cairn-auth.workspace = true
cairn-schema.workspace = true
cairn-service.workspace = true
cairn-store.workspace = true
metrics.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
cairn-engine.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
