# PRACTICES, The validation ladder: the full ladder on every push, plus a nightly run, and the
# simulation campaigns nightly outside the gate, and the release archives on a pushed v* tag.
# Linux runners only. mise installs the pinned tools; a tool that fails to install fails the
# job, and the lint step fails on any tool still missing, so nothing is skipped.
name: check

on:
  push:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned by full commit SHA, its release in a comment: a tag can be moved.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Only `mise run sim` uses cargo-patina, and it builds from source; the ladder skips it.
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
      # The property tests at more cases than a local run's 64
      # (decisions/2026-10-08-property-tests-run-64-cases-locally-and-256-in-ci.md).
      PROPTEST_CASES: 256
      # The browser host's module as it ships, optimized: its bindings are the ones the generated
      # step checks, and the browser step tests it (a local check builds the faster wasm-dev profile;
      # decisions/2026-10-08-the-check-builds-the-wasm-module-without-lto.md).
      CAIRN_WASM_PROFILE: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The compiled dependencies and the cargo registry, from the last push to main: without
      # them every run compiled the whole dependency tree from nothing, most of the job. It
      # restores Cargo's own target directory, so Cargo still decides what is fresh, and saves
      # it without the workspace's crates or stale dependencies: a 0.6 GB entry, where the whole
      # directory after a check is 5.8 GB, half of it the workspace's own test binaries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript) for the lint and generated steps.
      - run: npm ci
      # The browser step's browser, at the version @playwright/test pins.
      - run: npx playwright install --with-deps chromium
      - run: mise run check
      # The check prints only what failed; the complete log is a file.
      - if: failure()
        run: tail -n +1 dist/ladder/*.log

  # Every step, as on push, with the property tests at a larger case count
  # (PRACTICES, The validation ladder).
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
      PROPTEST_CASES: 4096
      CAIRN_WASM_PROFILE: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The compiled dependencies and the cargo registry, from the last push to main: without
      # them every run compiled the whole dependency tree from nothing, most of the job. It
      # restores Cargo's own target directory, so Cargo still decides what is fresh, and saves
      # it without the workspace's crates or stale dependencies: a 0.6 GB entry, where the whole
      # directory after a check is 5.8 GB, half of it the workspace's own test binaries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript) for the lint and generated steps.
      - run: npm ci
      # The browser step's browser, at the version @playwright/test pins.
      - run: npx playwright install --with-deps chromium
      - run: mise run check
      # The check prints only what failed; the complete log is a file.
      - if: failure()
        run: tail -n +1 dist/ladder/*.log

  # PRACTICES, Simulation with patina: the campaigns, nightly and on demand, never on push and
  # never part of check. mise builds cargo-patina from source at the pinned revision.
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # mise builds cargo-patina with whatever cargo rustup resolves; without this the
      # runner's default toolchain builds it and fails the pinned crate's rust-version.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run sim

  # Releases (ARCHITECTURE, Build, run, deploy): a pushed tag vX.Y.Z, once the check passes on
  # it, is built on each Linux target with that version, and one job with write access attaches
  # the archives to the GitHub release
  # (decisions/2026-10-16-release-archives-are-built-by-ci-for-linux.md).
  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history, to check the tag is on it.
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: npm ci
      # build.rs refuses a tag that is not a semantic version.
      - run: mise run build:release
        env:
          CAIRN_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runner }}
          path: dist/release/
          if-no-files-found: error

  # The only job that can write: no checkout, no build, only the archives the legs made.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Create the release, or add to it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          archives=(dist/release/*.tar.gz)
          [ "${#archives[@]}" -gt 0 ] || { echo "::error::no release archives"; exit 1; }
          for archive in "${archives[@]}"; do
            [ -f "$archive.sha256" ] || { echo "::error::$archive has no .sha256"; exit 1; }
          done
          assets=(dist/release/*)
          # A pre-release part (a "-" before any "+build") makes a GitHub pre-release.
          core=${TAG%%+*}
          prerelease=false
          if [[ $core == *-* ]]; then prerelease=true; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease="$prerelease"
          else
            gh release create "$TAG" --verify-tag --generate-notes \
              --prerelease="$prerelease" "${assets[@]}"
          fi
