# PRACTICES, The validation ladder: the full ladder on every push, plus a nightly run. Linux
# runners only. mise installs the pinned tools; a tool that fails to install fails the job,
# and rung 1 fails on any tool still missing, so nothing is skipped.
name: check

on:
  push:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check

  # Every rung that exists, as on push. The brief that adds rung 3 raises its property test
  # case count here (PRACTICES, The validation ladder: a larger case count nightly), and the
  # simulation track adds `mise run sim` as its own job.
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check
