# PRACTICES, The validation ladder: the full ladder on every push, plus a nightly run with more
# property cases, split into parts that run side by side on separate runners (scripts/ladder
# --parts); and the simulation campaigns nightly outside the gate. Linux runners only. mise
# installs the pinned tools; a tool that fails to install fails the job, and the lint step fails on
# any tool still missing, so nothing is skipped.
name: check

on:
  push:
    # Not tags: a release is dispatched (release.yml), and a pushed tag runs nothing.
    branches: ["**"]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned by full commit SHA, its release in a comment: a tag can be moved.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A run in flight on main is never cancelled: it finishes and saves its caches, and a newer
  # push waits for it (replacing any run already waiting), so the newest run covers everything
  # pushed before it. Any other ref cancels the run a newer push supersedes
  # (decisions/2026-10-16-ci-caches-survive-failed-runs-and-main-runs-finish.md).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # The ladder's parts, which the next job runs one runner each
  # (decisions/2026-10-16-ci-runs-the-ladder-in-parts-on-separate-runners.md): a step added to the
  # ladder runs in CI with no edit here, and the ladder refuses a step that belongs to no part.
  parts:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.list.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        # Two commands: `echo "parts=$(...)"` would hide the ladder's exit status.
        run: |
          parts=$(scripts/ladder --parts)
          printf 'parts=%s\n' "$parts" >>"$GITHUB_OUTPUT"

  part:
    needs: parts
    name: check (${{ matrix.part }})
    runs-on: ubuntu-latest
    # A hung job on main holds the next run, which waits instead of cancelling it (PRACTICES,
    # Explicit limits).
    timeout-minutes: 45
    strategy:
      # A failing part must not cancel the others mid-build: they finish their tests and save
      # their caches.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.parts.outputs.parts) }}
    env:
      # Only `mise run sim` uses cargo-patina, and it builds from source; the ladder skips it.
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
      # The property tests at more cases than a local run's 64, and at a larger count in the
      # nightly run (decisions/2026-10-08-property-tests-run-64-cases-locally-and-256-in-ci.md).
      PROPTEST_CASES: ${{ github.event_name == 'schedule' && 4096 || 256 }}
      # The engine's module as it ships, optimized: its bindings are the ones the generated
      # step checks, and the browser step tests it (a local check builds the faster wasm-dev profile;
      # decisions/2026-10-08-the-check-builds-the-wasm-module-without-lto.md).
      CAIRN_WASM_PROFILE: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # rust-cache hashes Cargo.lock and the members' manifests, not the root one that holds the
      # build profiles: a profile change must not exact-hit artifacts built with the old one.
      - id: profiles
        run: echo "hash=$(awk '/^\[/ { p = /^\[profile/ } p' Cargo.toml | sha256sum | cut -c1-8)" >>"$GITHUB_OUTPUT"
      # The compiled dependencies and the cargo registry, one entry per part (a key is saved once,
      # so parts sharing one would leave all but the first to finish out). Saved from main even
      # when a later step fails, and once per lock file, profile and toolchain: it restores
      # Cargo's own target directory, so Cargo still decides what is fresh, and saves it without
      # the workspace's crates or stale dependencies.
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-${{ matrix.part }}-${{ steps.profiles.outputs.hash }}
          # The testbeds build into their own target directories; lint lints them and rust runs
          # their unit tests.
          workspaces: |
            .
            ${{ (matrix.part == 'lint' || matrix.part == 'rust') && 'testbeds/multiplayer' || '' }}
            ${{ (matrix.part == 'lint' || matrix.part == 'rust') && 'testbeds/durability' || '' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What the restore gave: rust-cache's cache-hit is "true" for an exact key match only, and
      # a restore from an older key (a partial one) leaves the dependencies' artifacts in target/
      # with cache-hit "false"; nothing restored leaves it empty. The ladder words the state on
      # its build line (scripts/ladder). The web build has no cache to report.
      - id: cache-state
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then state=exact
          elif [ -n "$(ls -A target 2>/dev/null)" ]; then state=partial
          else state=none; fi
          echo "state=$state" >>"$GITHUB_OUTPUT"
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript, Vitest, Vite).
      - run: npm ci
      # The browser step's browser, without --with-deps: the runner image has the libraries it
      # needs, and the apt round trip cost more than the download. The download is not cached: a
      # restore took as long as fetching it (about 7 s).
      - if: matrix.part == 'browser'
        run: npx playwright install chromium
      - run: mise run check --part "$PART"
        env:
          PART: ${{ matrix.part }}
          LADDER_CACHE_STATE: ${{ steps.cache-state.outputs.state }}
      # The check prints only what failed; the complete log is a file.
      - if: failure()
        run: tail -n +1 dist/ladder/*.log
      # Every test's time from the browser step's run, to see what the step spends its minutes on.
      - if: always() && matrix.part == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/app/dist/playwright*.json
          if-no-files-found: ignore

  # GitHub keeps 10 GB of caches per repository and evicts the least recently used past it. Every
  # Cargo.lock change saves a whole new set of entries and leaves the superseded one until then, so
  # three generations once sat at 8.8 GB and an eviction took main's live entries. After the parts
  # have saved, keep the newest entry of each kind (a part's rust-cache entry, the mise entry per
  # platform) on this ref and delete the rest, in the one job that can delete caches. Entries left
  # on a tag ref are never restored by main, so they all go
  # (decisions/2026-10-22-ci-keeps-only-the-newest-cache-entry-of-each-kind.md).
  prune-caches:
    needs: part
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the superseded caches
        run: |
          gh cache list --limit 1000 --json id,key,ref,createdAt >caches.json
          jq -r --arg ref "$GITHUB_REF" '
            def kind: sub("-[0-9a-f]{64}$"; "") | sub("^(?<part>v0-rust-check-[^-]+)-.*"; "\(.part)");
            ([.[] | select(.ref | contains("refs/tags/")) | .id]
             + ([.[] | select(.ref == $ref)] | group_by(.key | kind)
                | map(sort_by(.createdAt) | reverse | .[1:][].id))) | .[]
          ' caches.json | while read -r id; do
            gh cache delete "$id"
          done
          gh cache list --limit 1000

  # The gate: green only when every part ran and passed. A part that was skipped because the
  # list of parts failed counts as a failure here, not as a success.
  check:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.part.result }}
        run: '[ "$RESULT" = success ] || { echo "a part of the check did not pass ($RESULT)"; exit 1; }'

  # PRACTICES, Simulation with patina: the campaigns, nightly and on demand, never on push and
  # never part of check. mise builds cargo-patina from source at the pinned revision.
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # mise builds cargo-patina with whatever cargo rustup resolves; without this the
      # runner's default toolchain builds it and fails the pinned crate's rust-version.
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise run sim
