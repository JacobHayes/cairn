# PRACTICES, The validation ladder: the full ladder on every push, plus a nightly run, and the
# simulation campaigns nightly outside the gate. Linux runners only. mise installs the pinned
# tools; a tool that fails to install fails the job, and rung 1 fails on any tool still
# missing, so nothing is skipped.
name: check

on:
  push:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Only `mise run sim` uses cargo-patina, and it builds from source; the ladder skips it.
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript) for rungs 1 and 5.
      - run: npm ci
      # Rung 6's browser, at the version @playwright/test pins.
      - run: npx playwright install --with-deps chromium
      - run: mise run check

  # Every rung that exists, as on push, with rung 3's property tests at a larger case count
  # (PRACTICES, The validation ladder).
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
      PROPTEST_CASES: 4096
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript) for rungs 1 and 5.
      - run: npm ci
      # Rung 6's browser, at the version @playwright/test pins.
      - run: npx playwright install --with-deps chromium
      - run: mise run check

  # PRACTICES, Simulation with patina: the campaigns, nightly and on demand, never on push and
  # never part of check. mise builds cargo-patina from source at the pinned revision.
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # mise builds cargo-patina with whatever cargo rustup resolves; without this the
      # runner's default toolchain builds it and fails the pinned crate's rust-version.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run sim
