# PRACTICES, The validation ladder: the full ladder on every push, plus a nightly run, and the
# simulation campaigns nightly outside the gate. Linux runners only. mise installs the pinned
# tools; a tool that fails to install fails the job, and rung 1 fails on any tool still
# missing, so nothing is skipped.
name: check

on:
  push:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned by full commit SHA, its release in a comment: a tag can be moved.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Only `mise run sim` uses cargo-patina, and it builds from source; the ladder skips it.
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
      # Rung 3's property tests at more cases than a local run's 64
      # (decisions/2026-10-08-property-tests-run-64-cases-locally-and-256-in-ci.md).
      PROPTEST_CASES: 256
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The compiled dependencies and the cargo registry, from the last push to main: without
      # them every run compiled the whole dependency tree from nothing, most of the job. It
      # restores Cargo's own target directory, so Cargo still decides what is fresh, and saves
      # it without the workspace's crates or stale dependencies: a 0.6 GB entry, where the whole
      # directory after a check is 5.8 GB, half of it the workspace's own test binaries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript) for rungs 1 and 5.
      - run: npm ci
      # Rung 6's browser, at the version @playwright/test pins.
      - run: npx playwright install --with-deps chromium
      - run: mise run check

  # Every rung that exists, as on push, with rung 3's property tests at a larger case count
  # (PRACTICES, The validation ladder).
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: "cargo:https://github.com/JacobHayes/patina"
      PROPTEST_CASES: 4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The compiled dependencies and the cargo registry, from the last push to main: without
      # them every run compiled the whole dependency tree from nothing, most of the job. It
      # restores Cargo's own target directory, so Cargo still decides what is fresh, and saves
      # it without the workspace's crates or stale dependencies: a 0.6 GB entry, where the whole
      # directory after a check is 5.8 GB, half of it the workspace's own test binaries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The npm workspace's tools (TypeScript, eslint, openapi-typescript) for rungs 1 and 5.
      - run: npm ci
      # Rung 6's browser, at the version @playwright/test pins.
      - run: npx playwright install --with-deps chromium
      - run: mise run check

  # PRACTICES, Simulation with patina: the campaigns, nightly and on demand, never on push and
  # never part of check. mise builds cargo-patina from source at the pinned revision.
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # mise builds cargo-patina with whatever cargo rustup resolves; without this the
      # runner's default toolchain builds it and fails the pinned crate's rust-version.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run sim
