journey: j_launch
description: "A launch pinned to a date: the freeze, beta, and materials deadlines all derive from it. Kickoff is done, the launch pin is shifted a week when feature work slips, and the code freeze's actual date lands later than the chain from the launch pin allows."
steps:
- note: Start the launch, fill the roles directly, and pin the launch date.
  today: "2026-09-01"
  at: "2026-09-01T09:00:00Z"
  actor:
    user: u_ana
  patch:
    id: p_pl_01
    target:
      journey: j_launch
    base_revision: 0
    deployment_revision: 1
    mutations:
    - op: create_journey
      name: Launch the reporting release
      from:
        route: product-launch
        version: 1
    - op: fill_role
      role: r_launch_lead
      identities:
      - who_k3d7qm2xw5tn6pfa
    - op: fill_role
      role: r_writers
      identities:
      - who_h3w7bs5xkq2dfnr6
    - op: set_pin
      node: n_launch
      date: "2026-11-16"
- note: Kickoff is done, recording its actual date, and feature work starts.
  today: "2026-09-05"
  at: "2026-09-05T10:00:00Z"
  actor:
    user: u_ana
  patch:
    id: p_pl_02
    target:
      journey: j_launch
    base_revision: 1
    mutations:
    - op: transition
      node: n_kickoff
      transition: complete
    - op: transition
      node: n_features
      transition: start
- note: >-
    Feature work slips; the launch pin moves a week later, which moves every
    deadline that derives from it.
  today: "2026-10-01"
  at: "2026-10-01T16:00:00Z"
  actor:
    user: u_ana
  patch:
    id: p_pl_03
    target:
      journey: j_launch
    base_revision: 2
    mutations:
    - op: shift_pin
      node: n_launch
      offset_days: 7
- note: >-
    Feature work and hardening finish; the code freeze is done later than the chain
    from the launch pin allows, which is a shortfall, not a rejection.
  today: "2026-11-04"
  at: "2026-11-04T18:00:00Z"
  actor:
    user: u_ana
  patch:
    id: p_pl_04
    target:
      journey: j_launch
    base_revision: 3
    mutations:
    - op: transition
      node: n_features
      transition: complete
    - op: transition
      node: n_hardening
      transition: complete
    - op: transition
      node: n_code_freeze
      transition: complete
    - op: set_recorded_date
      node: n_code_freeze
      end: finish
      date: "2026-11-04"
