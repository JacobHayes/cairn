# The durability testbed: the service on the real SQLite store under patina's filesystem
# faults and crash-restart (PRACTICES, Simulation with patina: Testbeds, `durability`). Its
# own Cargo workspace (the empty [workspace] table), so `cargo build` here resolves only
# this tree. The check ladder formats and lints it as a separate workspace (lint step), runs
# its unit tests (unit step) and sweeps it (sim step).
[workspace]

[package]
name = "cairn-durability"
description = "Durability testbed: after every crash-restart, state equals the replayed log and no acknowledged commit is missing."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/JacobHayes/cairn"
publish = false

[dependencies]
# The crates under test, by path: the service over the SQLite store, and the engine's replay
# the invariants compare against.
cairn-engine = { path = "../../crates/engine" }
cairn-schema = { path = "../../crates/schema" }
cairn-service = { path = "../../crates/service" }
cairn-store = { path = "../../crates/store" }
cairn-store-sqlite = { path = "../../crates/store-sqlite" }
# The deployment's time zone the service takes, at the root workspace's version, from jiff's
# bundled database (the fixtures' zone).
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# The SDK at the release mise.toml pins the runner to.
patina-dst = { git = "https://github.com/JacobHayes/patina", tag = "v0.12.2" }
# The SQLite backend's runtime: one current-thread runtime with its timer.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }

# The crate-wide lints of the root workspace (Cargo.toml [workspace.lints]); this
# workspace cannot inherit them. The lint step runs clippy with warnings denied.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
